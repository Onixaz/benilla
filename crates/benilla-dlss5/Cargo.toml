[package]
name = "benilla-dlss5"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Isolated NGX Feature 18 initialization for Benilla"
build = "build.rs"

[lints]
workspace = true

[features]
# The A/B key is an instrument, never a player-facing setting.
dev = []
# Links the NVIDIA NGX SDK named by `DLSS_SDK`; without it the NGX calls report failure.
ngx = []

[dependencies]
ash.workspace = true
bevy = { workspace = true, features = ["raw_vulkan_init"] }
libloading.workspace = true
wgpu.workspace = true
